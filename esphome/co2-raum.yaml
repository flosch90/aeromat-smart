# ESPHome: CO2-Sensor (Sensirion SCD40/SCD41) am ESP32 für Loxone
# Verdrahtung SCD4x -> ESP32:  VCC -> 3V3,  GND -> GND,  SDA -> GPIO21,  SCL -> GPIO22
# Loxone liest die Werte per Virtuellem HTTP-Eingang (ohne Login), siehe unten.

esphome:
  name: co2-raum

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

ota:
  - platform: esphome
    password: !secret ota_password

# Liefert die Messwerte als JSON, z. B. http://co2-raum.local/sensor/co2
web_server:
  port: 80

i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: scd4x
    update_interval: 30s
    automatic_self_calibration: true   # braucht ab und zu Frischluft (~400 ppm), bei gelüftetem Raum gegeben
    co2:
      name: "co2"
    temperature:
      name: "temperatur"
    humidity:
      name: "feuchte"
