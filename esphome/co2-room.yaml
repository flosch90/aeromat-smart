# ESPHome: CO2 sensor (Sensirion SCD40/SCD41) on an ESP32 for Loxone
# Wiring SCD4x -> ESP32:  VCC -> 3V3,  GND -> GND,  SDA -> GPIO21,  SCL -> GPIO22
# Loxone reads the values via a Virtual HTTP Input (no login), see README.

esphome:
  name: co2-room

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

ota:
  - platform: esphome
    password: !secret ota_password

# Serves the readings as JSON, e.g. http://co2-room.local/sensor/co2
web_server:
  port: 80

i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: scd4x
    update_interval: 30s
    automatic_self_calibration: true   # needs fresh air (~400 ppm) now and then, given in a ventilated room
    co2:
      name: "co2"
    temperature:
      name: "temperature"
    humidity:
      name: "humidity"
